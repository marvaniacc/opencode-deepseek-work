version: "3.9"

# Local development stack for WishUBest.
#   docker compose up -d
#
# Services:
#   - postgres  : main database (Prisma migrations + app)
#   - redis     : BullMQ queues (optional in MVP sync path)
#   - minio     : S3-compatible object storage for private documents
#                 (set STORAGE_DRIVER=s3 to use it; default is `local`)

services:
  postgres:
    image: postgres:16-alpine
    container_name: wishubest-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wishubest
    ports:
      - "5432:5432"
    volumes:
      - wishubest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wishubest-redis
    ports:
      - "6379:6379"
    volumes:
      - wishubest_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: wishubest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wishubest_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wishubest_pg:
  wishubest_redis:
  wishubest_minio: